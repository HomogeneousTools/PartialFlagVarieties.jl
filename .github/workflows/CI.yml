name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  test:
    name: Julia ${{ matrix.version }} — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version: ['1.10', '1.11', '1.12', '1']
        os: [ubuntu-latest]
        include:
          - version: '1'
            os: macos-latest

    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      - name: Install Lie.jl from GitHub
        run: julia --project=. -e 'using Pkg; Pkg.add(url="https://github.com/HomogeneousTools/Lie.jl")'
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1

  doctest:
    name: Doctests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - name: Install dependencies
        run: |
          julia --project=docs -e 'using Pkg; Pkg.add(url="https://github.com/HomogeneousTools/Lie.jl"); Pkg.develop(PackageSpec(path=".")); Pkg.add(["Documenter", "StaticArrays"]); Pkg.instantiate()'
      - name: Run doctests
        run: julia --project=docs -e 'using Documenter, PartialFlagVarieties; doctest(PartialFlagVarieties; manual="docs/src")'

  examples:
    name: Example — ${{ matrix.example }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example:
          - BottVanishing.jl
          - CICY3-1606.04076.jl
          - CICY3-1607.07821.jl
          # this one is rather slow, so we skip it for now
          #- FanoFourfolds.jl
          - FanoFourfoldsK3.jl
          - FanoFourfoldsQuiverZeroLoci.jl
          - FanoThreefolds.jl
          # this one is rather slow, so we skip it for now
          #- HochschildAffine.jl
          - Hyperkaehler.jl
          - Kuechle.jl
          - LinearSections.jl
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - name: Install Lie.jl from GitHub
        run: julia --project=. -e 'using Pkg; Pkg.add(url="https://github.com/HomogeneousTools/Lie.jl"); Pkg.add("JSON")'
      - uses: julia-actions/julia-buildpkg@v1
      - name: Run example
        run: |
          mkdir -p examples-output
          julia --project=. examples/${{ matrix.example }} > examples-output/${{ matrix.example }}.log 2>&1
      - name: Upload example output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: example-${{ matrix.example }}
          path: examples-output/${{ matrix.example }}.log
