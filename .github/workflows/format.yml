name: formatting

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  format:
    name: JuliaFormatter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5.0.1
      - uses: julia-actions/setup-julia@v3.0.1
        with:
          version: '1'
      - name: Check formatting
        # Formatting is driven by devtools/format.jl, which pins the
        # JuliaFormatter version (the single source of truth, shared with the
        # pre-commit hook). To change the version, edit that script — nowhere else.
        run: julia devtools/format.jl --check
