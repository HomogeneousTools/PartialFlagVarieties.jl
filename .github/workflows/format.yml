name: formatting

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  format:
    name: JuliaFormatter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5.0.1
      - uses: julia-actions/setup-julia@v3.0.1
        with:
          version: '1'
      - name: Check formatting
        # JuliaFormatter is PINNED on purpose. An unpinned `Pkg.add` floats to
        # the latest release, which can reformat files nobody touched and break
        # CI out of the blue (v2.9.x reindented multiline comprehension filters
        # and did exactly that). Bump this version deliberately, and keep it in
        # sync with `.hooks/pre-commit` and `CONTRIBUTING.md`
        # (grep the repo for: JuliaFormatter", version=).
        run: |
          julia -e 'using Pkg; Pkg.activate(; temp=true); Pkg.add(Pkg.PackageSpec(; name="JuliaFormatter", version="2.9.3")); using JuliaFormatter; format(".")'
          git --no-pager diff --exit-code -- '*.jl'
