name: tests

on:
  push:
  pull_request:
  repository_dispatch:
    types: [semisimple-jl-updated, zerolocus62-updated]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  test:
    name: Julia ${{ matrix.version }} — ${{ matrix.os }}
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        version: ['1.11', '1.12', 'nightly']
        os: [ubuntu-latest]
        include:
          - version: '1'
            os: macos-latest
    steps:
      - uses: actions/checkout@v5.0.1
      - uses: julia-actions/setup-julia@v3.0.1
        with:
          version: ${{ matrix.version }}
      #- uses: julia-actions/cache@v2.1.0
      - name: Resolve test dependencies
        run: |
          rm -f Manifest.toml
          julia --project=. -e 'using Pkg; Pkg.instantiate()'
      - uses: julia-actions/julia-buildpkg@v1.6.0
      - uses: julia-actions/julia-runtest@v1.6.0

  codecov:
    name: Codecov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        with:
          coverage: true
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}

  doctest:
    name: Doctests
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v5.0.1
      - uses: julia-actions/setup-julia@v3.0.1
        with:
          version: '1'
      #- uses: julia-actions/cache@v2.1.0
      - name: Install docs dependencies
        run: |
          rm -f docs/Manifest.toml
          julia --project=docs -e 'using Pkg; Pkg.instantiate()'
      - name: Run doctests
        run: julia --project=docs -e 'using Documenter, PartialFlagVarieties; doctest(PartialFlagVarieties; manual="docs/src")'

  examples:
    name: Example — ${{ matrix.example }}
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        example:
          - BottVanishing.jl
          - CICY3-1606.04076.jl
          - CICY3-1607.07821.jl
          - FanoFourfoldsK3.jl
          - FanoFourfoldsQuiverZeroLoci.jl
          - FanoThreefolds.jl
          - Hyperkaehler.jl
          - HyperellipticLinesExceptional.jl
          - Kuechle.jl
          - LinearSections.jl
    steps:
      - uses: actions/checkout@v5.0.1
      - uses: julia-actions/setup-julia@v3.0.1
        with:
          version: '1'
      #- uses: julia-actions/cache@v2.1.0
      - name: Resolve example dependencies
        run: |
          rm -f Manifest.toml
          julia --project=. -e 'using Pkg; Pkg.instantiate()'
      - uses: julia-actions/julia-buildpkg@v1.6.0
      - name: Run example
        run: |
          mkdir -p examples-output
          julia --project=. examples/${{ matrix.example }} > examples-output/${{ matrix.example }}.log 2>&1
      - name: Write summary
        if: always()
        run: |
          echo "## ${{ matrix.example }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat examples-output/${{ matrix.example }}.log >> $GITHUB_STEP_SUMMARY
